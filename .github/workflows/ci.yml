name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el pipeline solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar (con auditoría NuGet de vulnerabilidades)
        run: dotnet restore

      - name: Compilar (analizadores, advertencias como errores)
        run: dotnet build --no-restore -c Release

      - name: Pruebas (dominio, aplicación, arquitectura e integración)
        run: dotnet test --no-build -c Release --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -qE "^\s+>" vulnerables.txt; then echo "Hay paquetes con vulnerabilidades conocidas"; exit 1; fi

      - name: Migraciones al día con el modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Practicas.Infrastructure --startup-project src/Practicas.Api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/TestResults/**/coverage.cobertura.xml

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-fund

      - name: Auditoría de dependencias
        run: npm audit --audit-level=moderate

      - name: Lint (TypeScript + accesibilidad de plantillas)
        run: npm run lint

      - name: Pruebas
        run: npm run test:ci

      - name: Compilación de producción
        run: npm run build
